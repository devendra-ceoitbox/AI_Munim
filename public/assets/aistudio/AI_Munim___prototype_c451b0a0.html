<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Munim – prototype</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2EF;--card:#fff;--ink:#14233B;--mut:#5B6B7F;--line:#D5DDD8;--acc:#0F7B6C;--accbg:#DDF1EC;--warn:#8F5600;--warnbg:#FBEBCF;--bad:#B3261E;--badbg:#F9DEDB;--nav:#14233B;--navt:#C9D6E6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0F1620;--card:#172131;--ink:#E6ECF3;--mut:#93A3B6;--line:#2A3849;--acc:#3CC2AB;--accbg:#17383A;--warn:#F0B04A;--warnbg:#3B2E14;--bad:#FF8A80;--badbg:#3E1D1B;--nav:#0B111A}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 'IBM Plex Sans',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:var(--nav);color:var(--navt);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
nav h1{font-size:17px;margin:0 8px 2px;color:#fff;font-weight:600}nav small{display:block;margin:0 8px 14px;font-size:11px;opacity:.7}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:8px 10px;border-radius:6px;font:inherit;cursor:pointer}
nav button:hover{background:#ffffff14}nav button.on{background:var(--acc);color:#fff}
main{padding:18px 22px;max-width:1100px;width:100%}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
h2{margin:0;font-size:21px;font-weight:600}h3{margin:0 0 8px;font-size:14px;font-weight:600}
select,input{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:10px 12px}
.k b{display:block;font-size:20px;font-weight:600}.k span{color:var(--mut);font-size:12px}.k.w{border-left-color:#D98A00}.k.b{border-left-color:var(--bad)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mut);font-weight:500}td.r,th.r{text-align:right}
.wrap{overflow-x:auto}.f{font-size:12px;color:var(--mut)}.f input,.f select{display:block;width:100%;margin-top:3px;font-size:14px}
.t{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--accbg);color:var(--acc);white-space:nowrap}
.t.w{background:var(--warnbg);color:var(--warn)}.t.b{background:var(--badbg);color:var(--bad)}
button.a{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:6px 11px;font:inherit;cursor:pointer}
button.a:hover{filter:brightness(1.1)}button.g{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[disabled]{opacity:.45;cursor:not-allowed}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}.steps i{font-style:normal;padding:3px 10px;border-radius:12px;background:var(--bg);color:var(--mut);font-size:12px;border:1px solid var(--line)}.steps i.d{background:var(--accbg);color:var(--acc);border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.note{background:var(--warnbg);color:var(--warn);padding:8px 10px;border-radius:6px;font-size:13px;margin-bottom:12px}
.bar{height:10px;background:var(--acc);border-radius:3px;min-width:2px}
.ans{border-left:3px solid var(--acc);padding:2px 12px;margin:8px 0}.ans small{color:var(--mut);display:block}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--nav);color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:9;max-width:90vw}
#toast.s{opacity:1}
@media(max-width:760px){.app{grid-template-columns:1fr}nav{height:auto;position:static;display:flex;flex-wrap:wrap;gap:2px}nav h1,nav small{width:100%}nav button{width:auto}.two{grid-template-columns:1fr}main{padding:12px}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style></head><body>
<div class="app"><nav id="nav"></nav><main id="m"></main></div><div id="toast" role="status"></div>
<script>
const fm=n=>(n<0?'−':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');
const R={owner:{n:'Owner / Admin',nav:['ov','cap','pay','col','gst','bank','cash','ai','aud','set'],sub:1,app:1,col:1},
fin:{n:'Finance Executive',nav:['ov','cap','pay','col','gst','bank','cash','ai'],sub:1,col:1},
col:{n:'Collections Executive',nav:['ov','col','cash','ai'],col:1},
app:{n:'Approver',nav:['ov','cap','pay','gst','cash','ai','aud'],app:1}};
const NAV={ov:'Overview',cap:'Capture & approve',col:'Collections',gst:'GST workspace',bank:'Bank reconciliation',cash:'Cash forecast',ai:'Ask AI Munim',aud:'Audit log',pay:'Payables & bills',set:'Settings'};
const S={role:'owner',tab:'ov',cash:300000,scen:'base',draft:null,salesTax:112500,aiLog:[],
ar:[{id:'INV-1042',c:'Sharma Traders',amt:118000,od:15,pr:3},{id:'INV-1051',c:'Gupta Exports',amt:182000,od:8,pr:5},{id:'INV-0988',c:'Kapoor Steels',amt:245000,od:42,pr:null},{id:'INV-1055',c:'Bluewave Services',amt:64500,od:-6,pr:null},{id:'INV-0901',c:'Mehta & Sons',amt:96000,od:71,pr:null,dis:1}],
ap:[{id:'RP/221',c:'Raj Polymers',amt:206500,due:4},{id:'OL-77',c:'Om Logistics',amt:38000,due:7},{id:'AP-413',c:'Apex Packaging',amt:155000,due:11}],
gst:[{s:'Gupta Polymers',no:'GP-88',bk:18000,pt:18000,st:'matched'},{s:'Raj Polymers',no:'RP/221',bk:31500,pt:31500,st:'matched'},{s:'Apex Packaging',no:'AP-413',bk:27900,pt:27000,st:'mismatch'},{s:'Om Logistics',no:'OL-77',bk:6840,pt:null,st:'books'},{s:'Delta Chemicals',no:'DC-910',bk:null,pt:12100,st:'portal'}],
bank:[{id:1,n:'NEFT – Sharma Traders',a:118000,sg:'Match to INV-1042 (exact amount, name)',cf:96,f:()=>settle('INV-1042')},{id:2,n:'NEFT – Gupta Exports',a:100000,sg:'Partial allocation to INV-1051 (₹82,000 stays open)',cf:78,f:()=>{S.ar[1].amt-=100000}},{id:3,n:'RTGS – Om Logistics',a:-38000,sg:'Match to bill OL-77',cf:94,f:()=>{S.ap=S.ap.filter(x=>x.id!='OL-77')}},{id:4,n:'Bank charges',a:-590,sg:'Classify as Bank Charges and post',cf:90,f:()=>{}},{id:5,n:'UPI – unknown payer',a:12500,sg:'No match found. Needs review',cf:0,ex:1,f:()=>{}}],
audit:[],pend:[],lim:100000,co:{n:'Sample Traders Pvt Ltd',g:'06AABCS1234F1Z5',f:'Apr 2026 – Mar 2027',i:'Trading'},users:[{n:'Anita Rao',e:'anita@sampletraders.in',r:'owner',on:1},{n:'Vikram Sethi',e:'vikram@sampletraders.in',r:'fin',on:1},{n:'Neha Kapoor',e:'neha@sampletraders.in',r:'col',on:1},{n:'Rohit Jain',e:'rohit@sampletraders.in',r:'app',on:1}]};
const DOCS={s:{type:'Sales Invoice',party:'Bluewave Services',no:'INV-1058',date:'04 Nov 2026',gstin:'06AABCB4521K1Z7',taxable:84000,rate:18,hsn:'998314',ledger:'Consulting Revenue',lc:71},
p:{type:'Purchase Invoice',party:'Delta Chemicals',no:'DC-910',date:'30 Oct 2026',gstin:'06AAECD1177H1Z4',taxable:67222,rate:18,hsn:'2915',ledger:'Raw Materials Purchase',lc:92},
d:{type:'Purchase Invoice',party:'Raj Polymers',no:'RP/221',date:'28 Oct 2026',gstin:'06AAACR8890M1Z2',taxable:175000,rate:18,hsn:'3901',ledger:'Raw Materials Purchase',lc:95}};
const LEDGERS=['Consulting Revenue','Product Sales','Raw Materials Purchase','Freight & Logistics','Office Expenses'];
const $=s=>document.querySelector(s),role=()=>R[S.role];
function log(a){S.audit.unshift({t:new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}),u:R[S.role].n,a})}
function toast(m){const t=$('#toast');t.textContent=m;t.className='s';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2600)}
function settle(id){S.ar=S.ar.filter(x=>x.id!=id)}
const itc=()=>S.gst.filter(r=>r.st=='matched'||r.st=='resolved').reduce((a,r)=>a+r.pt,0);
const net=()=>Math.max(0,S.salesTax-itc());
function fc(sc){const ev=[];S.ar.filter(x=>!x.dis).forEach(x=>{let d=x.pr!=null?x.pr:x.od>0?(x.od>30?12:8):Math.max(1,-x.od),a=x.amt;if(sc=='cautious'){d+=10;a*=.8}if(sc=='optimistic')d=Math.max(1,d-1);ev.push([d,a])});
S.ap.forEach(x=>ev.push([x.due,-x.amt]));ev.push([17,-net()],[25,-260000]);let c=S.cash;const s=[c];for(let d=1;d<=30;d++){ev.filter(e=>e[0]==d).forEach(e=>c+=e[1]);s.push(c)}return s}
const low=s=>{const m=Math.min(...s);return{m,d:s.indexOf(m)}};
function go(t){S.tab=t;render()}
function setRole(r){S.role=r;if(!R[r].nav.includes(S.tab))S.tab='ov';render()}
function render(){const r=role();$('#nav').innerHTML='<h1>AI Munim</h1><small>GST, collections & cash flow</small>'+r.nav.map(t=>`<button class="${t==S.tab?'on':''}" onclick="go('${t}')">${NAV[t]}</button>`).join('');
const sc=S.role=='owner'?'':'';$('#m').innerHTML=`<div class="top"><h2>${NAV[S.tab]}</h2><label>Viewing as <select onchange="setRole(this.value)" aria-label="Role">${Object.keys(R).map(k=>`<option value="${k}" ${k==S.role?'selected':''}>${R[k].n}</option>`).join('')}</select></label></div>`+V[S.tab]()}
const tag=(s,c='')=>`<span class="t ${c}">${s}</span>`;
const V={
ov(){const ov=S.ar.filter(x=>x.od>0&&!x.dis),a=S.ar.reduce((s,x)=>s+x.amt,0),o=ov.reduce((s,x)=>s+x.amt,0),p7=S.ap.filter(x=>x.due<=7).reduce((s,x)=>s+x.amt,0),b=low(fc('base')),c=low(fc('cautious'));
const al=[];if(c.m<0)al.push(['b',`Cautious scenario: cash falls to ${fm(c.m)} around day ${c.d}. Review payment proposals.`]);const mm=S.gst.filter(r=>['mismatch','books','portal'].includes(r.st)).length;if(mm)al.push(['w',`${mm} GSTR-2B exceptions are open. They affect eligible ITC.`]);S.ar.filter(x=>x.od>30&&!x.dis).forEach(x=>al.push(['w',`${x.c}: ${fm(x.amt)} overdue ${x.od} days${x.pr==null?' with no promise to pay':''}.`]));S.bank.filter(x=>!x.done).length&&al.push(['w',`${S.bank.filter(x=>!x.done).length} bank lines await reconciliation.`]);
return`<div class="grid"><div class="k"><b>${fm(S.cash)}</b><span>Book cash balance</span></div><div class="k w"><b>${fm(a)}</b><span>Receivables outstanding</span></div><div class="k b"><b>${fm(o)}</b><span>Overdue (excl. disputed)</span></div><div class="k w"><b>${fm(p7)}</b><span>Payables due in 7 days</span></div><div class="k"><b>${fm(net())}</b><span>Estimated net GST (working)</span></div><div class="k ${b.m<0?'b':''}"><b>${fm(b.m)}</b><span>30-day low point (base)</span></div></div>
<div class="two"><div class="card"><h3>Needs attention</h3>${al.map(x=>`<p>${tag(x[0]=='b'?'Risk':'Review',x[0])} ${x[1]}</p>`).join('')||'<p>Nothing needs attention.</p>'}</div>
<div class="card"><h3>How the system flows</h3><div class="steps">${['Capture','AI reads','Validate','Approve & post','Reconcile','Analyse'].map(x=>`<i class="d">${x}</i>`).join('')}</div><p style="color:var(--mut);margin:0">Enter once, AI organises, people approve, and the books, GST workings, collections and cash forecast stay current. Try the <b>Capture & approve</b> tab, then watch the numbers above change.</p></div></div>
<div class="card"><h3>Recent activity</h3>${S.audit.slice(0,5).map(a=>`<p style="margin:3px 0">${a.t} · ${a.u}: ${a.a}</p>`).join('')||'<p style="color:var(--mut)">No activity yet.</p>'}</div>`},
cap(){const d=S.draft,r=role();let h=`<div class="card"><h3>Upload a sample document</h3><p style="color:var(--mut);margin-top:0">Pick a document to simulate OCR extraction.</p>${r.sub?`<button class="a" onclick="up('s')">Sales invoice (PDF)</button> <button class="g" onclick="up('p')">Supplier bill (image)</button> <button class="g" onclick="up('d')">Supplier bill (possible duplicate)</button>`:'<div class="note">Approvers review submitted drafts. Switch to Finance Executive to upload.</div>'}</div>`;
if(!d)return h;const t=tax(d),tot=d.taxable+t,V1=val(d),i=['Extracted','Validated','Awaiting approval','Posted'].indexOf(d.st);const st=['Captured','Extracted','Validated','Awaiting approval','Approved','Posted'];const at=d.st=='Extracted'?2:d.st=='Awaiting approval'?3:5;
h+=`<div class="card"><h3>${d.type} · ${d.no} · ${d.party}</h3><div class="steps">${st.map((x,k)=>`<i class="${k<=at?'d':''}">${x}</i>`).join('')}</div>
<div class="two"><div class="wrap"><table><tr><th>Field</th><th>Value</th><th>AI confidence</th></tr>${[['Party',d.party,98],['Number / date',d.no+' · '+d.date,99],['GSTIN',d.gstin,97],['HSN/SAC',d.hsn,93],['Taxable value',fm(d.taxable),99],['GST @ '+d.rate+'%',fm(t),99],['Total',fm(tot),99]].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${tag(x[2]+'%')}</td></tr>`).join('')}<tr><td>Ledger</td><td><select onchange="S.draft.ledger=this.value;S.draft.lc=100;S.draft.ed=1;render()" ${d.st=='Posted'?'disabled':''}>${LEDGERS.map(l=>`<option ${l==d.ledger?'selected':''}>${l}</option>`).join('')}</select></td><td>${d.ed?tag('Confirmed by user'):tag(d.lc+'% · review',d.lc<80?'w':'')}</td></tr></table></div>
<div><h3>Validation</h3>${V1.map(x=>`<p style="margin:4px 0">${tag(x[0]=='ok'?'Pass':x[0]=='warn'?'Review':'Blocked',x[0]=='ok'?'':x[0]=='warn'?'w':'b')} ${x[1]}</p>`).join('')}
<div style="margin-top:12px">${act(d,V1)}</div></div></div>`;
if(d.jv)h+=`<h3 style="margin-top:14px">Posted journal (balanced)</h3><div class="wrap"><table><tr><th>Account</th><th class="r">Debit</th><th class="r">Credit</th></tr>${d.jv.map(l=>`<tr><td>${l[0]}</td><td class="r">${l[1]?fm(l[1]):''}</td><td class="r">${l[2]?fm(l[2]):''}</td></tr>`).join('')}</table></div>`;return h+'</div>'},
gst(){const rows=S.gst,lab={matched:['Matched',''],mismatch:['Value mismatch','w'],books:['Books only','w'],portal:['Portal only','b'],resolved:['Resolved','' ],fu:['Supplier follow-up sent','w']};
return`<div class="note">AI Munim prepares and reconciles GST data. A prepared working is not a filed return. Filing needs an authorised GSTN/GSP integration and approval.</div><div class="grid"><div class="k"><b>${fm(S.salesTax)}</b><span>Output tax (posted sales)</span></div><div class="k"><b>${fm(rows.reduce((s,r)=>s+(r.bk||0),0))}</b><span>ITC in books</span></div><div class="k"><b>${fm(itc())}</b><span>Eligible ITC (matched or resolved)</span></div><div class="k"><b>0</b><span>ITC claimed in filed return</span></div><div class="k w"><b>${fm(net())}</b><span>Estimated net liability</span></div></div>
<div class="card wrap"><h3>GSTR-2B reconciliation</h3><table><tr><th>Supplier</th><th>Doc no.</th><th class="r">Books tax</th><th class="r">Portal tax</th><th>Status</th><th>Action</th></tr>${rows.map((r,i)=>`<tr><td>${r.s}</td><td>${r.no}</td><td class="r">${r.bk!=null?fm(r.bk):'–'}</td><td class="r">${r.pt!=null?fm(r.pt):'–'}</td><td>${tag(...lab[r.st])}</td><td>${r.st=='mismatch'?`<button class="g" onclick="gx(${i},'resolved','Accepted portal value; difference ${fm(r.bk-r.pt)} noted')">Accept portal value</button>`:r.st=='books'?`<button class="g" onclick="gx(${i},'fu','Follow-up sent to supplier')">Ask supplier</button>`:r.st=='portal'?`<button class="g" onclick="go('cap')">Post the bill</button>`:''}</td></tr>`).join('')}</table></div>`},
col(){const bk=[['Not due',x=>x.od<=0],['1–30 days',x=>x.od>0&&x.od<=30],['31–60 days',x=>x.od>30&&x.od<=60],['61–90 days',x=>x.od>60]],mx=Math.max(...S.ar.map(x=>x.amt),1);
return`<div class="card"><h3>Receivables ageing</h3>${bk.map(b=>{const v=S.ar.filter(b[1]).reduce((s,x)=>s+x.amt,0);return`<div style="display:grid;grid-template-columns:90px 1fr 100px;gap:8px;align-items:center;margin:5px 0"><span>${b[0]}</span><div class="bar" style="width:${v/(mx*1.5)*100}%"></div><span class="r" style="text-align:right">${fm(v)}</span></div>`}).join('')}</div>
<div class="card wrap"><h3>Invoices</h3><table><tr><th>Invoice</th><th>Customer</th><th class="r">Open</th><th>Status</th><th>Promise</th><th>Actions</th></tr>${S.ar.map((x,i)=>`<tr><td>${x.id}</td><td>${x.c}</td><td class="r">${fm(x.amt)}</td><td>${x.dis?tag('Disputed','b'):x.od>0?tag(x.od+' days overdue',x.od>30?'b':'w'):tag('Due in '+-x.od+' days')}</td><td>${x.pr!=null?'Day +'+x.pr:'–'}</td><td><button class="g" onclick="rem(${i})">WhatsApp reminder</button> <button class="g" onclick="prom(${i})">Promise +5d</button></td></tr>`).join('')}</table><p style="color:var(--mut);margin-bottom:0">Disputes keep the receivable but are excluded from the forecast. Reminders require confirmation and respect consent and quiet hours.</p></div>`},
bank(){return`<div class="card wrap"><h3>Imported bank lines</h3><table><tr><th>Narration</th><th class="r">Amount</th><th>AI suggestion</th><th>Action</th></tr>${S.bank.map(b=>`<tr><td>${b.n}</td><td class="r">${fm(b.a)}</td><td>${b.sg} ${b.cf?tag(b.cf+'%',b.cf<85?'w':''):''}</td><td>${b.done?tag('Reconciled'):b.ex?tag('Exception queue','b'):b.ex===0?'':`<button class="a" onclick="bk(${b.id})">Confirm</button>`}${!b.done&&b.cf==0&&!b.ex?'':''}${b.cf==0&&!b.done&&!b.ex?`<button class="g" onclick="S.bank[4].ex=1;render()">Send to exceptions</button>`:''}</td></tr>`).join('')}</table><p style="color:var(--mut);margin-bottom:0">Confirming updates the book balance, allocates the receipt or payment and refreshes the forecast.</p></div>`},
cash(){const sc=['cautious','base','optimistic'],s=fc(S.scen),l=low(s),mn=Math.min(...s,0),mx=Math.max(...s),Y=v=>170-(v-mn)/(mx-mn)*150,pts=s.map((v,i)=>`${30+i*18.3},${Y(v)}`).join(' ');
return`<div class="card"><div class="top" style="margin:0 0 8px"><h3 style="margin:0">30-day cash forecast</h3><span>${sc.map(x=>`<button class="${x==S.scen?'a':'g'}" onclick="S.scen='${x}';render()">${x[0].toUpperCase()+x.slice(1)}</button>`).join(' ')}</span></div>
<svg viewBox="0 0 590 190" style="width:100%;height:auto" role="img" aria-label="Projected closing cash by day"><line x1="30" x2="580" y1="${Y(0)}" y2="${Y(0)}" stroke="currentColor" stroke-opacity=".3" stroke-dasharray="4"/><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2.5"/>${l.m<0?`<circle cx="${30+l.d*18.3}" cy="${Y(l.m)}" r="5" fill="var(--bad)"/>`:''}<text x="30" y="14" font-size="11" fill="currentColor">${fm(mx)}</text><text x="30" y="186" font-size="11" fill="currentColor">Day 0</text><text x="540" y="186" font-size="11" fill="currentColor">Day 30</text></svg>
<p>${l.m<0?tag('Shortfall','b')+` Cash drops below zero on day ${s.findIndex(v=>v<0)}, reaching ${fm(l.m)}.`:tag('Covered')+` Lowest projected cash is ${fm(l.m)} on day ${l.d}.`}</p></div>
<div class="card"><h3>Assumptions (editable in the full product)</h3><ul style="margin:0;padding-left:18px;color:var(--mut)"><li>Opening cash is the book balance of ${fm(S.cash)}.</li><li>Inflows follow promise-to-pay dates; otherwise 8 days (1–30 overdue) or 12 days (30+). Disputed invoices are excluded.</li><li>Cautious: collections slip 10 days and 20% is delayed. Optimistic: 1 day early.</li><li>Outflows: supplier bills on due date, estimated GST payment on day 17, payroll commitment of ₹2,60,000 on day 25.</li></ul></div>`},
ai(){return`<div class="card"><p style="margin-top:0;color:var(--mut)">Read-only. Answers use calculated figures from the data in this prototype and show their basis.</p><form onsubmit="event.preventDefault();ask($('#q').value)" style="display:flex;gap:8px;flex-wrap:wrap"><input id="q" style="flex:1;min-width:200px" placeholder="Ask about dues, GST, cash…" aria-label="Question"><button class="a">Ask</button></form><p>${['Which customers are overdue?','Will cash be enough for 30 days?','What is my GST liability?','What payments are due next week?','Why is GSTR-2B different?'].map(q=>`<button class="g" style="margin:2px" onclick="ask('${q}')">${q}</button>`).join('')}</p>${S.aiLog.map(a=>`<p style="margin-bottom:0"><b>${a.q}</b></p><div class="ans">${a.a}</div>`).join('')}</div>`},
pay(){const r=role(),sup=[...new Set(S.ap.map(x=>x.c).concat(S.gst.map(x=>x.s)))];
return`${r.sub?`<div class="card"><h3>Add a purchase / supplier bill</h3><div class="grid" style="margin:0 0 10px"><label class="f">Supplier<input id="b_s" list="sl" placeholder="Choose or type a name"></label><datalist id="sl">${sup.map(s=>`<option>${s}</option>`).join('')}</datalist><label class="f">Bill number<input id="b_n"></label><label class="f">Supplier GSTIN<input id="b_g" placeholder="15 characters"></label><label class="f">Taxable value (₹)<input id="b_t" type="number"></label><label class="f">GST rate (%)<select id="b_r"><option>5</option><option>12</option><option selected>18</option><option>28</option></select></label><label class="f">Ledger<select id="b_l">${LEDGERS.map(l=>`<option>${l}</option>`).join('')}</select></label></div><button class="a" onclick="addBill()">Submit for approval</button> <span style="color:var(--mut)">Prefer a file? Upload it in Capture & approve and AI will fill these fields.</span></div>`:'<div class="note">Only Finance Executives and the Owner can add bills. You can approve submitted bills below.</div>'}
<div class="card wrap"><h3>Awaiting approval</h3><table><tr><th>Supplier</th><th>Bill</th><th class="r">Total</th><th>Submitted by</th><th>Action</th></tr>${S.pend.map((d,i)=>`<tr><td>${d.party}</td><td>${d.no}</td><td class="r">${fm(d.taxable+tax(d))}</td><td>${d.by}</td><td><button class="a" ${r.app?'':'disabled'} onclick="okBill(${i})">Approve & post</button> <button class="g" ${r.app?'':'disabled'} onclick="noBill(${i})">Reject</button></td></tr>`).join('')||'<tr><td colspan="5" style="color:var(--mut)">No bills waiting. Add one above.</td></tr>'}</table>${r.app?'':'<p style="color:var(--mut);margin-bottom:0">Switch to Approver or Owner to approve.</p>'}<p style="color:var(--mut);margin-bottom:0">Approver limit: ${fm(S.lim)} per bill. Larger bills need the Owner.</p></div>
<div class="card wrap"><h3>Supplier bills in books</h3><table><tr><th>Supplier</th><th>Bill</th><th class="r">Amount</th><th>Due</th></tr>${S.ap.map(x=>`<tr><td>${x.c}</td><td>${x.id}</td><td class="r">${fm(x.amt)}</td><td>Day +${x.due}</td></tr>`).join('')}</table></div>`},
set(){const c=S.co;return`<div class="card"><h3>Company setup</h3><div class="grid" style="margin:0 0 10px"><label class="f">Legal name<input id="c_n" value="${c.n}"></label><label class="f">GSTIN<input id="c_g" value="${c.g}"></label><label class="f">Financial year<input id="c_f" value="${c.f}"></label><label class="f">Industry profile<select id="c_i">${['Trading','Manufacturing','Services','Distribution'].map(x=>`<option ${x==c.i?'selected':''}>${x}</option>`).join('')}</select></label><label class="f">Approver limit per bill (₹)<input id="c_l" type="number" value="${S.lim}"></label></div><button class="a" onclick="saveCo()">Save setup</button></div>
<div class="card wrap"><h3>Users & access</h3><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th></tr>${S.users.map((u,i)=>`<tr><td>${u.n}</td><td>${u.e}</td><td>${R[u.r].n}</td><td>${u.on?tag('Active'):tag('Deactivated','b')}</td><td><button class="g" onclick="tg(${i})">${u.on?'Deactivate':'Activate'}</button></td></tr>`).join('')}</table><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><input id="u_n" placeholder="Name"><input id="u_e" placeholder="Email"><select id="u_r" aria-label="New user role">${Object.keys(R).map(k=>`<option value="${k}">${R[k].n}</option>`).join('')}</select><button class="a" onclick="addUser()">Add user</button></div><p style="color:var(--mut);margin-bottom:0">No open self-registration. Only people added here can sign in, and deactivating a user removes access immediately.</p></div>`},
aud(){return`<div class="card wrap"><h3>Audit log</h3><table><tr><th>Time</th><th>User</th><th>Action</th></tr>${S.audit.map(a=>`<tr><td>${a.t}</td><td>${a.u}</td><td>${a.a}</td></tr>`).join('')||'<tr><td colspan="3" style="color:var(--mut)">Actions appear here as you work.</td></tr>'}</table></div>`}};
const tax=d=>Math.round(d.taxable*d.rate/100);
function val(d){const v=[];const dup=[...S.ar,...S.ap].some(x=>x.id==d.no)&&d.st!='Posted';v.push(dup?['err',`Duplicate: ${d.no} already exists in the books.`]:['ok','No duplicate document number.']);v.push(/^\d{2}[A-Z]{5}\d{4}[A-Z]\dZ[A-Z\d]$/.test(d.gstin)?['ok','GSTIN format is valid.']:['err','GSTIN format is invalid.']);v.push(['ok','Taxable value + GST equals total.']);v.push(d.lc<80?['warn','Ledger mapping has low confidence. Confirm it.']:['ok','Ledger and tax code match approved history.']);return v}
function up(k){S.draft={...DOCS[k],k,st:'Extracted'};log(`Uploaded ${DOCS[k].no}; AI extracted fields`);render()}
function act(d,v){const r=role(),b=v.some(x=>x[0]=='err');if(d.st=='Posted')return tag('Posted and locked');if(d.st=='Extracted')return b?'<div class="note">Fix or reject before submitting.</div>':`<button class="a" ${r.sub?'':'disabled'} onclick="sub()">Submit for approval</button> <button class="g" onclick="S.draft=null;render()">Reject</button>`;
return`<button class="a" ${r.app?'':'disabled'} onclick="post()">Approve & post</button> <button class="g" onclick="S.draft.st='Extracted';render()">Return for correction</button>${r.app?'':'<p style="color:var(--mut)">Waiting for an approver. Switch role to approve.</p>'}`}
function sub(){if(S.draft.lc<80&&!S.draft.ed)return toast('Confirm the ledger first');S.draft.st='Awaiting approval';log(`Submitted ${S.draft.no} for approval`);render()}
function post(){const d=S.draft,t=tax(d),tot=d.taxable+t,sale=d.type[0]=='S';d.jv=sale?[['Accounts Receivable – '+d.party,tot,0],[d.ledger,0,d.taxable],['Output GST',0,t]]:[[d.ledger,d.taxable,0],['Input GST',t,0],['Accounts Payable – '+d.party,0,tot]];
if(sale){S.ar.push({id:d.no,c:d.party,amt:tot,od:-30,pr:null});S.salesTax+=t}else{S.ap.push({id:d.no,c:d.party,amt:tot,due:20});const g=S.gst.find(r=>r.no==d.no);if(g){g.bk=t;g.st=g.pt==t?'matched':'mismatch'}else S.gst.push({s:d.party,no:d.no,bk:t,pt:null,st:'books'})}
d.st='Posted';log(`Approved and posted ${d.no} (${fm(tot)}); journal balanced`);toast('Posted. Ledgers, GST and forecast updated');render()}
function addBill(){const g=id=>$('#'+id).value.trim(),d={type:'Purchase Invoice',party:g('b_s'),no:g('b_n'),gstin:g('b_g').toUpperCase(),taxable:+g('b_t'),rate:+$('#b_r').value,ledger:$('#b_l').value,hsn:'',lc:100,ed:1,st:'Awaiting approval',by:role().n,date:new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})};
if(!d.party||!d.no||!(d.taxable>0))return toast('Enter supplier, bill number and taxable value');
if(!/^\d{2}[A-Z]{5}\d{4}[A-Z]\dZ[A-Z\d]$/.test(d.gstin))return toast('GSTIN format is invalid');
if([...S.ap,...S.pend.map(x=>({id:x.no}))].some(x=>x.id==d.no))return toast('Duplicate: bill '+d.no+' already exists');
S.pend.push(d);log(`Bill ${d.no} from ${d.party} submitted for approval`);toast('Submitted for approval');render()}
function okBill(i){const d=S.pend[i],t=d.taxable+tax(d);if(S.role=='app'&&t>S.lim)return toast('Above approver limit of '+fm(S.lim)+'. Owner must approve');S.pend.splice(i,1);S.draft=d;post();S.draft=null;render()}
function noBill(i){log(`Bill ${S.pend[i].no} rejected`);S.pend.splice(i,1);render()}
function saveCo(){const g=$('#c_g').value.trim().toUpperCase();if(!/^\d{2}[A-Z]{5}\d{4}[A-Z]\dZ[A-Z\d]$/.test(g))return toast('GSTIN format is invalid');S.co={n:$('#c_n').value,g,f:$('#c_f').value,i:$('#c_i').value};S.lim=+$('#c_l').value||0;log('Company setup and approval limit updated');toast('Setup saved');render()}
function addUser(){const n=$('#u_n').value.trim(),e=$('#u_e').value.trim();if(!n||!e.includes('@'))return toast('Enter a name and a valid email');S.users.push({n,e,r:$('#u_r').value,on:1});log(`User ${n} added as ${R[$('#u_r').value].n}`);toast('User added');render()}
function tg(i){if(i==0)return toast('The primary owner can’t be deactivated');S.users[i].on=!S.users[i].on;log(`User ${S.users[i].n} ${S.users[i].on?'activated':'deactivated'}`);render()}
function gx(i,s,m){S.gst[i].st=s;if(s=='resolved'){S.gst[i].bk=S.gst[i].pt}log(`GST ${S.gst[i].no}: ${m}`);render()}
function rem(i){if(!role().col)return toast('Your role can’t send reminders');log(`Reminder sent to ${S.ar[i].c} for ${S.ar[i].id}`);toast('Reminder queued after your confirmation')}
function prom(i){if(!role().col)return toast('Your role can’t record promises');S.ar[i].pr=5;log(`Promise recorded: ${S.ar[i].c} to pay ${S.ar[i].id} in 5 days`);render()}
function bk(id){if(!role().sub)return toast('Your role can’t reconcile bank lines');const b=S.bank.find(x=>x.id==id);b.f();S.cash+=b.a;b.done=1;log(`Bank line confirmed: ${b.n} ${fm(b.a)}`);render()}
function ask(q){const l=q.toLowerCase();let a;
if(/overdue|customer/.test(l)){const o=S.ar.filter(x=>x.od>0).sort((x,y)=>y.amt*y.od-x.amt*x.od);a=o.map(x=>`${x.c}: ${fm(x.amt)}, ${x.od} days${x.dis?' (disputed)':x.pr!=null?', promise day +'+x.pr:', no promise'}`).join('<br>')+`<small>Basis: open invoices past due date, ranked by amount × age. Sources: ${o.map(x=>x.id).join(', ')}.</small>`}
else if(/cash|30|sufficient|enough/.test(l)){const b=low(fc('base')),c=low(fc('cautious'));a=`<b>Fact:</b> book cash is ${fm(S.cash)}.<br><b>Estimate (base):</b> low point ${fm(b.m)} on day ${b.d}.<br><b>Estimate (cautious):</b> ${c.m<0?`shortfall of ${fm(c.m)} by day ${c.d}`:'low point '+fm(c.m)}.<br><b>Recommendation:</b> ${c.m<0?'defer or stage the larger supplier payments and chase overdue invoices.':'no action needed.'}<small>Basis: Cash forecast tab. Assumptions are listed there.</small>`}
else if(/gst|liability|tax/.test(l))a=`Output tax ${fm(S.salesTax)} − eligible ITC ${fm(itc())} = <b>${fm(net())}</b> estimated net.<br>ITC in books is ${fm(S.gst.reduce((s,r)=>s+(r.bk||0),0))}, but only matched or resolved items count as eligible.<small>This is a working figure, not a filed return. Source: GST workspace.</small>`;
else if(/payment|due|week/.test(l)){const o=S.ap.filter(x=>x.due<=7);a=o.map(x=>`${x.c} ${x.id}: ${fm(x.amt)} due day ${x.due}`).join('<br>')||'No supplier bills fall due within 7 days.';a+=`<small>Total ${fm(o.reduce((s,x)=>s+x.amt,0))}. Payments are proposed only. Release needs approval.</small>`}
else if(/2b|differ|mismatch/.test(l)){const o=S.gst.filter(r=>['mismatch','books','portal','fu'].includes(r.st));a=o.map(r=>`${r.s} ${r.no}: books ${r.bk!=null?fm(r.bk):'none'} vs portal ${r.pt!=null?fm(r.pt):'none'}`).join('<br>')||'All documents are matched or resolved.';a+='<small>Source: GSTR-2B reconciliation.</small>'}
else a='I can’t answer that from the data here. Try overdue customers, cash for 30 days, GST liability, payments due, or GSTR-2B differences.';
S.aiLog.unshift({q,a});log(`AI question answered: ${q.slice(0,40)}`);render()}
render();
</script></body></html>
